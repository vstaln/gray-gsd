[package]
name = "gray-gsd"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "GSD spec->plan->tasks workflow: /gsd <goal> writes .gsd/ markdown state and executes task-by-task with verification"

[[bin]]
name = "gray-gsd"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
